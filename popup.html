<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Follow-Up Tracker</title>
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header h2 {
            font-size: 16px;
            margin: 0;
            font-weight: 700;
        }

        p {
            font-size: 12px;
            color: #475569;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #0a66c2;
            color: white;
            margin-bottom: 8px;
        }

        .btn-primary:hover {
            background-color: #084e96;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
        }

        #status.success { color: #16a34a; }
        #status.error { color: #dc2626; }
        #status.loading { color: #2563eb; }

        #sheetLink {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>LinkedIn Follow-Up</h2>
    </div>

    <p>Manage your outreach tasks, track follow-up dates, and analyze conversions.</p>

    <button id="openDashboardButton" class="btn btn-primary">
        🚀 Open Tracker Dashboard
    </button>

    <button id="connectButton" class="btn btn-secondary">
        Connect Google Sheets
    </button>

    <div id="status"></div>
    <a id="sheetLink" href="#" target="_blank">Open Google Sheet ↗</a>

    <script src="popup.js"></script>
</body>
</html>
